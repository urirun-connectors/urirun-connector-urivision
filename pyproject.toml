[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "urirun-connector-urivision"
version = "0.1.0"
description = "Native urivision:// URI surface over urivision/VURI (.vuri process -> DecisionCard) for ifuri and urirun"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Tom Sapletta" }]
dependencies = ["urirun>=0.4.14", "urivision>=0.1.0"]

[project.scripts]
urirun-urivision = "urirun_connector_urivision.core:main"

[project.entry-points."urirun.bindings"]
urivision = "urirun_connector_urivision.core:urirun_bindings"

[tool.setuptools.packages.find]
include = ["urirun_connector_urivision*"]

[tool.setuptools.package-data]
urirun_connector_urivision = ["connector.manifest.json"]
